name: Django CI

on:
  push:
    branches:
      - dev # Trigger CI on push to the dev branch
  # pull_request:
  #   branches:
  #     - main # Uncomment this to enable PR checks for main branch

jobs:
  install-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        run: |
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pre-commit  # Install pre-commit

      - name: Set up pre-commit hooks
        run: |
          source venv/bin/activate
          pre-commit install  # Set up pre-commit hooks in the .git directory

  lint:
    runs-on: ubuntu-latest
    needs: install-dependencies  # Ensures this job runs after install-dependencies
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        run: |
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pre-commit  # Install pre-commit

      - name: Run pre-commit hooks
        run: |
          source venv/bin/activate
          pre-commit run --all-files  # Run all hooks (flake8, isort, black)
