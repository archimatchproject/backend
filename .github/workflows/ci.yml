name: Django CI

on:
  push:
    branches:
      - dev # Trigger CI on push to the dev branch
  # pull_request:
  #   branches:
  #     - main # Uncomment this to enable PR checks for main branch

jobs:
  install-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        run: |
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pre-commit  # Install pre-commit

      - name: Set up pre-commit hooks
        run: |
          source venv/bin/activate
          pre-commit install  # Set up pre-commit hooks in the .git directory

  lint:
    runs-on: ubuntu-latest
    needs: install-dependencies
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        run: |
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pre-commit  # Install pre-commit

      - name: Run pre-commit hooks
        run: |
          source venv/bin/activate
          pre-commit run --all-files  # Run all hooks (flake8, isort, black)

  deploy:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up SSH for Azure VM
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.AZURE_SSH_PRIVATE_KEY }}

      - name: Deploy to Azure VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.AZURE_SSH_USER }}@${{ secrets.AZURE_VM_IP }} << 'EOF'
            # Navigate to the backend directory
            cd /home/azureuser/archimatch/backend/
            
            # Pull the latest changes from the repository
            git pull origin dev
            
            # Activate the virtual environment

            /home/azureuser/archimatch/backend/Env/bin/python -m pip install -r requirements.txt
            /home/azureuser/archimatch/backend/Env/bin/python manage.py makemigrations 

            /home/azureuser/archimatch/backend/Env/bin/python manage.py migrate

            
            # Restart services
            sudo systemctl restart uwsgi.service
            sudo systemctl restart bg_task.service
          EOF
