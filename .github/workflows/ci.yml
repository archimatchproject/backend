name: Django CI

on:
  push:
    branches:
      - dev # Trigger CI on push to the dev branch
  # pull_request:
  #   branches:
  #     - main # Uncomment this to enable PR checks for main branch

jobs:
  install-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Create and start virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Cache virtual environment
        uses: actions/cache@v2
        with:
          path: venv
          key: venv-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            venv-

  lint:
    runs-on: ubuntu-latest
    needs: install-dependencies  # Ensures this job runs after install-dependencies
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Restore virtual environment cache
        uses: actions/cache@v2
        with:
          path: venv
          key: venv-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            venv-

      - name: Activate virtual environment and check tools
        run: |
          source venv/bin/activate
          # Ensure the environment is activated and tools are available
          which flake8
          which isort
          which black

      - name: Run flake8
        run: |
          source venv/bin/activate
          flake8 .

      - name: Run isort (check only)
        run: |
          source venv/bin/activate
          isort --check-only --diff

      - name: Run black (check only)
        run: |
          source venv/bin/activate
          black --check .
